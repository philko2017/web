<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://static.line-scdn.net https://liffsdk.line-scdn.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://idly-junction-altitude.ngrok-free.dev https://api.line.me https://*.line.me https://*.line-scdn.net https://uts-front.line-apps.com; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="robots" content="noindex, nofollow">
<title>訂單管理｜水晶呢喃</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap">
<style>
:root {
--bg: #F5F2F8; --card: #FFFFFF; --ink: #241B2F; --muted: #6E6578; --line: #E6DFEE;
--brand: #6A3D9E; --brand-soft: #EFE7F8; --on-brand: #FFFFFF; --ok: #2F8A55; --warn: #B07A2E; --off: #9C90A3;
--body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
--display: "Noto Serif TC", "Songti TC", serif;
}
:root[data-theme="dark"] {
--bg: #17131D; --card: #221C2B; --ink: #EEE8F4; --muted: #A79DB3; --line: #352C40;
--brand: #B795E6; --brand-soft: #2E2440; --on-brand: #1E1428; --ok: #6CC690; --warn: #DDA65C; --off: #7D7387; color-scheme: dark }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.6; }
.wrap { max-width: 560px; margin: 0 auto; padding: 20px 16px 48px; display: grid; gap: 14px; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
.hero { display: flex; gap: 12px; align-items: center; padding: 4px 2px; }
.hero > div:nth-child(2) { flex: 1; min-width: 0; }
.gem { flex: none; width: 48px; height: 48px; border-radius: 14px; background: linear-gradient(135deg, #8D63C4, #6A3D9E 55%, #4B2577); display: grid; place-items: center; color: #fff; font-family: var(--display); font-size: 1.4rem; }
.hero h1 { margin: 0; font-family: var(--display); font-size: 1.4rem; letter-spacing: .08em; }
.hero p { margin: 0; color: var(--muted); font-size: .86rem; }
.btn { border: 0; border-radius: 14px; padding: 12px 16px; font-weight: 700; background: var(--brand); color: var(--on-brand); }
.btn.ghost { background: var(--brand-soft); color: var(--brand); font-weight: 500; }
.btn.line { background: var(--card); border: 1px solid var(--line); color: var(--ink); font-weight: 500; }
.btn:disabled { opacity: .55; }
.row { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 16px; display: grid; gap: 12px; }
.list { display: grid; gap: 10px; }
.p { display: flex; gap: 12px; align-items: center; width: 100%; text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 10px; }
.p .th { flex: none; width: 64px; height: 64px; border-radius: 12px; background: var(--brand-soft); overflow: hidden; display: grid; place-items: center; font-size: 1.5rem; }
.p .th img { width: 100%; height: 100%; object-fit: cover; }
.p .tx { flex: 1; min-width: 0; display: grid; }
.p h2 { margin: 0; font-size: .98rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.p small { color: var(--muted); }
.st { flex: none; font-size: .75rem; border-radius: 999px; padding: 2px 10px; color: #fff; }
.st.上架 { background: var(--ok); } .st.草稿 { background: var(--warn); } .st.下架 { background: var(--off); }
label.f { display: grid; gap: 4px; font-size: .88rem; color: var(--muted); }
label.f input, label.f textarea { border: 1px solid var(--line); background: var(--bg); border-radius: 12px; padding: 10px 12px; color: var(--ink); width: 100%; }
label.f textarea { min-height: 110px; resize: vertical; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.photo { position: relative; aspect-ratio: 4 / 3; border-radius: 16px; border: 2px dashed var(--line); background: var(--brand-soft); display: grid; place-items: center; overflow: hidden; color: var(--brand); text-align: center; }
.photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.photo input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 6px 14px; font-size: .88rem; }
.chip[aria-pressed="true"] { background: var(--brand); border-color: var(--brand); color: var(--on-brand); }
.addcat { display: flex; gap: 8px; }
.addcat input { flex: 1; border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 6px 14px; min-width: 0; }
.status { text-align: center; font-size: .85rem; color: var(--muted); margin: 0; min-height: 1.4em; }
.msg { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 24px 16px; text-align: center; color: var(--muted); }
.msg h2 { margin: 0 0 6px; color: var(--ink); font-size: 1.05rem; }
.meta { font-size: .8rem; color: var(--muted); margin: 0; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; background: var(--card); }
.seg button { border: 0; background: none; padding: 6px 16px; font-size: .88rem; }
.seg button[aria-pressed="true"] { background: var(--brand); color: var(--on-brand); }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
.tile { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; display: grid; gap: 2px; }
.tile small { color: var(--muted); font-size: .8rem; }
.tile b { font-size: 1.35rem; font-variant-numeric: tabular-nums; }
.funnel { display: grid; gap: 8px; }
.fr { display: grid; grid-template-columns: 4.8em minmax(0, 1fr) auto; gap: 10px; align-items: center; font-size: .9rem; }
.bar { height: 14px; border-radius: 7px; background: var(--brand-soft); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--brand); border-radius: 7px; }
.fr span:last-child { white-space: nowrap; font-size: .82rem; text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
.todo { display: flex; gap: 8px; flex-wrap: wrap; }
.todo button { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 6px 12px; font-size: .86rem; }
.todo b { color: var(--brand); }
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
.chip { flex: none; border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 6px 14px; font-size: .88rem; }
.chip[aria-pressed="true"] { background: var(--brand); border-color: var(--brand); color: var(--on-brand); }
.o { display: grid; gap: 4px; width: 100%; text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px; }
.o .hd { display: flex; justify-content: space-between; gap: 8px; }
.o small { color: var(--muted); }
.st { flex: none; font-size: .75rem; border-radius: 999px; padding: 2px 10px; background: var(--brand-soft); color: var(--brand); white-space: nowrap; }
h2.sec { margin: 6px 2px 0; font-size: 1rem; }
ol.rank { margin: 0; padding-left: 1.4em; }
.sheet { position: fixed; inset: 0; background: rgba(20,14,28,.45); display: grid; align-items: end; z-index: 10; }
.panel { background: var(--card); border-radius: 22px 22px 0 0; max-height: 92vh; overflow-y: auto; width: 100%; max-width: 560px; margin: 0 auto; padding: 18px 16px calc(18px + env(safe-area-inset-bottom)); display: grid; gap: 10px; position: relative; }
.panel h3 { margin: 0; }
.close { position: absolute; right: 10px; top: 10px; width: 36px; height: 36px; border-radius: 50%; border: 0; background: var(--brand-soft); color: var(--brand); font-size: 1.1rem; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: .9rem; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; word-break: break-all; }
.act { display: grid; gap: 8px; border-top: 1px solid var(--line); padding-top: 10px; }
.wrap, .panel, .card, .order, .o, .sum, .kv, .two, .row, .line, .fr, .tiles, .list { min-width: 0; }
.wrap > *, .panel > *, .two > *, .row > *, .sum > *, .kv > * { min-width: 0; }
input, select, textarea { max-width: 100%; min-width: 0; box-sizing: border-box; }
input[type="date"] { -webkit-appearance: none; appearance: none; min-height: 44px; }
.two { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
h2, h3, b, small, dd, .note, .bank, .o div, .order div { overflow-wrap: anywhere; }
</style>
</head>
<body>
<div class="wrap">
<header class="hero">
<div class="gem" aria-hidden="true">單</div>
<div>
<h1>訂單管理</h1>
<p id="updated">載入中…</p>
</div>
</header>
<div class="msg" id="msg">載入中…</div>
<section id="main" hidden style="display:grid;gap:14px">
<div><div class="seg" role="group" aria-label="期間"><button type="button" data-d="d7" aria-pressed="true">7 天</button><button type="button" data-d="d30" aria-pressed="false">30 天</button></div></div>
<div class="tiles" id="tiles"></div>
<h2 class="sec">待處理</h2>
<div class="todo" id="todo"></div>
<h2 class="sec">購物流程（人數，括號是從上一關走到這一關的比例）</h2>
<div class="card funnel" id="funnel"></div>
<div class="two" id="ranks"></div>
<h2 class="sec">訂單</h2>
<div class="chips" id="filters" role="group" aria-label="訂單狀態"></div>
<div class="list" id="list"></div>
</section>
</div>
<div class="sheet" id="sheet" hidden>
<div class="panel" role="dialog" aria-modal="true" aria-labelledby="oNo">
<button type="button" class="close" id="oClose" aria-label="關閉">✕</button>
<h3 id="oNo"></h3>
<div id="oBody" style="display:grid;gap:10px"></div>
</div>
</div>
<script src="https://static.line-scdn.net/liff/edge/versions/2.31.2/sdk.js"></script>
<script src="app.js?v=20261112-hf"></script>
</body>
</html>
