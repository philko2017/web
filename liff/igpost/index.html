<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://static.line-scdn.net https://liffsdk.line-scdn.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://idly-junction-altitude.ngrok-free.dev https://api.line.me https://*.line.me https://*.line-scdn.net https://uts-front.line-apps.com; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="robots" content="noindex, nofollow">
<title>IG 貼文產生器｜水晶呢喃</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700;900&display=swap">
<style>
:root {
--bg: #F5F2F8; --card: #FFFFFF; --ink: #241B2F; --muted: #6E6578; --line: #E6DFEE;
--brand: #6A3D9E; --brand-soft: #EFE7F8; --on-brand: #FFFFFF; --ok: #2E7D5B; --err: #B3261E;
--body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
--display: "Noto Serif TC", "Songti TC", serif;
}
:root[data-theme="dark"] {
--bg: #17131D; --card: #221C2B; --ink: #EEE8F4; --muted: #A79DB3; --line: #352C40;
--brand: #B795E6; --brand-soft: #2E2440; --on-brand: #1E1428; --ok: #7FD1A8; --err: #FF8A80; color-scheme: dark }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.6; }
.wrap { max-width: 520px; margin: 0 auto; padding: 20px 16px 56px; display: grid; gap: 14px; }
.wrap, .wrap > *, .card, .card > *, .row, .row > * { min-width: 0; }
button { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
.hero { display: flex; gap: 12px; align-items: center; padding: 4px 2px; }
.hero > div:nth-child(2) { flex: 1; min-width: 0; }
.gem { flex: none; width: 48px; height: 48px; border-radius: 14px; background: linear-gradient(135deg, #8D63C4, #6A3D9E 55%, #4B2577); display: grid; place-items: center; color: #fff; font-family: var(--display); font-size: 1.4rem; }
.hero h1 { margin: 0; font-family: var(--display); font-size: 1.35rem; letter-spacing: .06em; }
.hero p { margin: 0; color: var(--muted); font-size: .86rem; }
.theme-btn { flex: none; width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--card); display: grid; place-items: center; }
.theme-btn svg { width: 19px; height: 19px; fill: none; stroke: var(--ink); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 16px; display: grid; gap: 12px; }
.step { display: flex; align-items: center; gap: 8px; margin: 0; font-size: 1rem; }
.step i { flex: none; width: 24px; height: 24px; border-radius: 50%; background: var(--brand); color: var(--on-brand); font-style: normal; font-size: .8rem; font-weight: 700; display: grid; place-items: center; }
.hint { margin: 0; color: var(--muted); font-size: .84rem; }
label, .lab { font-weight: 700; font-size: .9rem; }
input[type=text], textarea { width: 100%; max-width: 100%; font: inherit; font-size: 16px; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 11px 12px; }
textarea { resize: vertical; line-height: 1.7; }
#eTitle { font-family: var(--display); font-weight: 700; font-size: 1.1rem; line-height: 1.5; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.between { justify-content: space-between; }
.chip { font-size: .9rem; border: 1px solid var(--line); background: var(--bg); padding: 7px 16px; border-radius: 999px; }
.chip[aria-pressed="true"] { background: var(--brand); color: var(--on-brand); border-color: var(--brand); }
.go { width: 100%; font-weight: 700; font-size: 1.05rem; border: 0; border-radius: 14px; padding: 14px; background: var(--brand); color: var(--on-brand); }
.go:disabled, .ghost:disabled, .copy:disabled { opacity: .5; cursor: default; }
.ghost { font-size: .86rem; background: none; border: 1px solid var(--line); border-radius: 10px; padding: 7px 12px; }
.copy { font-size: .86rem; font-weight: 700; border: 0; border-radius: 10px; padding: 8px 14px; background: var(--brand-soft); color: var(--brand); }
.copy.done { background: var(--ok); color: #fff; }
.status { margin: 0; font-size: .84rem; color: var(--muted); min-height: 1.3em; }
.status.err { color: var(--err); }
.status.ok { color: var(--ok); }
.titles { display: grid; gap: 10px; }
.t { width: 100%; text-align: left; background: var(--bg); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 6px; }
.t b { font-family: var(--display); font-weight: 900; font-size: 1.12rem; line-height: 1.45; overflow-wrap: anywhere; }
.t small { color: var(--muted); font-size: .84rem; }
.t .pick { color: var(--brand); font-size: .82rem; font-weight: 700; }
.t[aria-current="true"] { border-color: var(--brand); box-shadow: 0 0 0 1px var(--brand); background: var(--brand-soft); }
.field { display: grid; gap: 6px; }
.count { color: var(--muted); font-size: .8rem; font-weight: 400; }
.all { background: var(--brand); color: var(--on-brand); }
.msg { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 24px 16px; text-align: center; color: var(--muted); }
.msg h2 { margin: 0 0 6px; color: var(--ink); font-size: 1.05rem; }
.foot { font-size: .78rem; color: var(--muted); text-align: center; margin: 0; }
</style>
</head>
<body>
<div class="wrap">
<div class="hero">
<div class="gem" aria-hidden="true">✦</div>
<div>
<h1>IG 貼文產生器</h1>
<p>標題、內文、hashtag，改好一鍵複製</p>
</div>
<button type="button" class="theme-btn" id="theme"></button>
</div>
<div class="msg" id="msg" hidden></div>
<div id="app" class="wrap" style="padding:0">
<form class="card" id="f">
<h2 class="step"><i>1</i>想寫什麼</h2>
<div class="field">
<label for="concept">基本概念</label>
<input type="text" id="concept" placeholder="例如：寶石、情感" maxlength="200" autocomplete="off" required>
<p class="hint">幾個關鍵字就可以，像「粉晶、桃花」「黑曜石、戴哪隻手」「缺火、紅色」。</p>
</div>
<div class="field">
<span class="lab" id="lenLab">內文字數</span>
<div class="row" id="len" role="group" aria-labelledby="lenLab">
<button type="button" class="chip" data-len="50" aria-pressed="false">50 字</button>
<button type="button" class="chip" data-len="100" aria-pressed="true">100 字</button>
</div>
</div>
<button class="go" id="go" type="submit">產生 5 個標題</button>
<p class="status" id="st1" aria-live="polite"></p>
</form>
<section class="card" id="s2" hidden>
<h2 class="step"><i>2</i>選一個標題</h2>
<p class="hint">點一個標題，就會照它寫內文和 hashtag。</p>
<div class="titles" id="titles"></div>
</section>
<section class="card" id="s3" hidden>
<h2 class="step"><i>3</i>修改後複製</h2>
<p class="hint">三格都可以直接改。按「複製」時，改好的版本會存進 Notion 喜好庫，下次產生會照這個口味寫。</p>
<div class="field">
<div class="row between"><label for="eTitle">標題</label><button type="button" class="copy" data-copy="標題">複製</button></div>
<textarea id="eTitle" rows="2"></textarea>
</div>
<div class="field">
<div class="row between"><label for="eBody">內文 <span class="count" id="bodyCount"></span></label><button type="button" class="copy" data-copy="內文">複製</button></div>
<textarea id="eBody" rows="7"></textarea>
<div class="row"><button type="button" class="ghost" id="reBody">重寫內文</button></div>
</div>
<div class="field">
<div class="row between"><label for="eTags">hashtag</label><button type="button" class="copy" data-copy="hashtag">複製</button></div>
<textarea id="eTags" rows="3"></textarea>
<div class="row"><button type="button" class="ghost" id="reTags">換一組 hashtag</button></div>
</div>
<button type="button" class="go copy all" data-copy="全部">全部複製（標題＋內文＋hashtag）</button>
<p class="status" id="st3" aria-live="polite"></p>
</section>
<p class="foot">內容由 AI 產生，數字可能是虛構的，發布前請自己改過一遍。</p>
</div>
</div>
<script src="https://static.line-scdn.net/liff/edge/versions/2.31.2/sdk.js"></script>
<script src="app.js?v=20261112"></script>
</body>
</html>
