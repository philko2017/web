<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://static.line-scdn.net https://liffsdk.line-scdn.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://idly-junction-altitude.ngrok-free.dev https://api.line.me https://*.line.me https://*.line-scdn.net https://uts-front.line-apps.com; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="robots" content="noindex, nofollow">
<title>商城｜水晶呢喃</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap">
<style>
:root {
--bg: #F5F2F8; --card: #FFFFFF; --ink: #241B2F; --muted: #6E6578; --line: #E6DFEE;
--brand: #6A3D9E; --brand-soft: #EFE7F8; --on-brand: #FFFFFF; --sold: #9C90A3;
--body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
--display: "Noto Serif TC", "Songti TC", serif;
}
:root[data-theme="dark"] {
--bg: #17131D; --card: #221C2B; --ink: #EEE8F4; --muted: #A79DB3; --line: #352C40;
--brand: #B795E6; --brand-soft: #2E2440; --on-brand: #1E1428; --sold: #7D7387; color-scheme: dark }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.6; }
body.locked { overflow: hidden; }
.wrap { max-width: 640px; margin: 0 auto; padding: 20px 16px 48px; display: grid; gap: 14px; }
button { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
.hero { display: flex; gap: 12px; align-items: center; padding: 4px 2px; }
.hero > div:nth-child(2) { flex: 1; min-width: 0; }
.gem { flex: none; width: 48px; height: 48px; border-radius: 14px; background: linear-gradient(135deg, #8D63C4, #6A3D9E 55%, #4B2577); display: grid; place-items: center; color: #fff; font-family: var(--display); font-size: 1.4rem; }
.hero h1 { margin: 0; font-family: var(--display); font-size: 1.4rem; letter-spacing: .08em; }
.hero p { margin: 0; color: var(--muted); font-size: .86rem; }
.theme-btn { flex: none; width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--card); display: grid; place-items: center; }
.theme-btn svg { width: 19px; height: 19px; fill: none; stroke: var(--ink); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 6px 14px; font-size: .88rem; }
.chip[aria-pressed="true"] { background: var(--brand); border-color: var(--brand); color: var(--on-brand); }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.item { display: grid; grid-template-columns: minmax(0, 1fr); min-width: 0; text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; padding: 0; }
.ph { aspect-ratio: 1; width: 100%; background: var(--brand-soft); display: grid; place-items: center; color: var(--muted); font-size: 2rem; position: relative; }
.ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
.badge { position: absolute; left: 8px; top: 8px; background: rgba(36,27,47,.75); color: #fff; font-size: .72rem; border-radius: 999px; padding: 2px 9px; }
.item .tx { padding: 10px 12px 12px; display: grid; gap: 2px; }
.item h2 { margin: 0; font-size: .95rem; line-height: 1.35; }
.price { color: var(--brand); font-weight: 700; }
.item.sold { opacity: .7; }
.msg { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 24px 16px; text-align: center; color: var(--muted); }
.msg h2 { margin: 0 0 6px; color: var(--ink); font-size: 1.05rem; }
.sheet { position: fixed; inset: 0; background: rgba(20,14,28,.45); display: grid; align-items: end; z-index: 10; }
.panel { background: var(--card); border-radius: 22px 22px 0 0; max-height: 92vh; overflow-y: auto; width: 100%; max-width: 640px; margin: 0 auto; padding-bottom: calc(18px + env(safe-area-inset-bottom)); }
.panel .ph { aspect-ratio: 4 / 3; }
.panel .body { padding: 16px; display: grid; gap: 10px; }
.panel h2 { margin: 0; font-family: var(--display); font-size: 1.3rem; }
.panel .price { font-size: 1.2rem; }
.facts { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: .9rem; }
.facts dt { color: var(--muted); }
.facts dd { margin: 0; }
.desc { white-space: pre-wrap; margin: 0; }
.cats { display: flex; gap: 6px; flex-wrap: wrap; }
.cats span { font-size: .78rem; background: var(--brand-soft); color: var(--brand); border-radius: 999px; padding: 2px 10px; }
.actions { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; margin-top: 4px; }
.btn { border: 0; border-radius: 14px; padding: 13px 16px; font-weight: 700; background: var(--brand); color: var(--on-brand); }
.btn.ghost { background: var(--brand-soft); color: var(--brand); font-weight: 500; }
.btn:disabled { background: var(--line); color: var(--muted); }
.top-btns { display: flex; gap: 8px; flex-wrap: wrap; }
.icon-btn { position: relative; flex: none; height: 40px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); padding: 0 14px; font-size: .9rem; }
.icon-btn b { position: absolute; right: -4px; top: -6px; min-width: 20px; height: 20px; border-radius: 10px; background: var(--brand); color: var(--on-brand); font-size: .72rem; display: grid; place-items: center; padding: 0 5px; }
.qty { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.qty button { width: 38px; height: 36px; border: 0; background: var(--brand-soft); color: var(--brand); font-size: 1.1rem; }
.qty span { min-width: 36px; text-align: center; }
.sheet h3 { margin: 0; font-family: var(--display); font-size: 1.2rem; }
.panel.plain { padding: 18px 16px calc(18px + env(safe-area-inset-bottom)); display: grid; gap: 12px; position: relative; }
.line { display: grid; grid-template-columns: 56px minmax(0, 1fr) auto; gap: 10px; align-items: center; }
.line .th { width: 56px; height: 56px; border-radius: 10px; overflow: hidden; background: var(--brand-soft); display: grid; place-items: center; }
.line .th img { width: 100%; height: 100%; object-fit: cover; }
.line small { color: var(--muted); }
.sum { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 12px; border-top: 1px solid var(--line); padding-top: 10px; }
.sum .tot { font-weight: 700; font-size: 1.1rem; color: var(--brand); }
label.f { display: grid; gap: 4px; font-size: .88rem; color: var(--muted); }
label.f input, label.f select, label.f textarea { border: 1px solid var(--line); background: var(--bg); border-radius: 12px; padding: 10px 12px; color: var(--ink); width: 100%; font: inherit; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.note { font-size: .82rem; color: var(--muted); margin: 0; }
.err { color: #C0392B; font-size: .86rem; margin: 0; min-height: 1.2em; }
.order { border: 1px solid var(--line); border-radius: 16px; padding: 12px; display: grid; gap: 6px; }
.order .acts { display: grid; grid-template-columns: repeat(auto-fit, minmax(88px, 1fr)); gap: 8px; }
.order .acts .btn { padding: 10px 8px; font-size: .88rem; }
.order .hd { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.st { font-size: .75rem; border-radius: 999px; padding: 2px 10px; background: var(--brand-soft); color: var(--brand); white-space: nowrap; }
.bank { background: var(--brand-soft); border-radius: 12px; padding: 10px 12px; font-size: .9rem; }
.close { position: absolute; right: 10px; top: 10px; width: 36px; height: 36px; border-radius: 50%; border: 0; background: rgba(36,27,47,.6); color: #fff; font-size: 1.1rem; }
.wrap, .panel, .card, .order, .o, .sum, .kv, .two, .row, .line, .fr, .tiles, .list { min-width: 0; }
.wrap > *, .panel > *, .two > *, .row > *, .sum > *, .kv > * { min-width: 0; }
input, select, textarea { max-width: 100%; min-width: 0; box-sizing: border-box; }
input[type="date"] { -webkit-appearance: none; appearance: none; min-height: 44px; }
.two { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
h2, h3, b, small, dd, .note, .bank, .o div, .order div { overflow-wrap: anywhere; }
</style>
</head>
<body>
<div class="wrap">
<header class="hero">
<div class="gem" aria-hidden="true">晶</div>
<div>
<h1>水晶呢喃商城</h1>
<p>Crystal Whispers</p>
</div>
<button type="button" class="theme-btn" id="theme" aria-label="切換深色模式"></button>
</header>
<div class="top-btns">
<button type="button" class="icon-btn" id="cartBtn">🛒 購物車<b id="cartN" hidden>0</b></button>
<button type="button" class="icon-btn" id="ordersBtn">📦 我的訂單</button>
</div>
<div class="chips" id="chips" role="group" aria-label="分類" hidden></div>
<div class="msg" id="msg">載入中…</div>
<div class="grid" id="grid" hidden></div>
</div>
<div class="sheet" id="sheet" hidden>
<div class="panel" role="dialog" aria-modal="true" aria-labelledby="dName">
<div class="ph" id="dPh"></div>
<button type="button" class="close" id="dClose" aria-label="關閉">✕</button>
<div class="body">
<h2 id="dName"></h2>
<div class="price" id="dPrice"></div>
<div class="cats" id="dCats"></div>
<dl class="facts" id="dFacts"></dl>
<p class="desc" id="dText"></p>
<div style="display:flex;align-items:center;gap:12px"><span class="note">數量</span>
<div class="qty"><button type="button" id="dMinus" aria-label="減少">−</button><span id="dQty">1</span><button type="button" id="dPlus" aria-label="增加">＋</button></div></div>
<div class="actions">
<button type="button" class="btn" id="dWant">加入購物車</button>
<button type="button" class="btn ghost" id="dAsk">問 Sammi</button>
</div>
<p class="note" id="dAdded" role="status" aria-live="polite"></p>
</div>
</div>
</div>
<div class="sheet" id="sheet2" hidden>
<div class="panel plain" role="dialog" aria-modal="true" aria-labelledby="s2Title">
<button type="button" class="close" id="s2Close" aria-label="關閉">✕</button>
<h3 id="s2Title"></h3>
<div id="s2Body" style="display:grid;gap:12px"></div>
</div>
</div>
<script src="https://static.line-scdn.net/liff/edge/versions/2.31.2/sdk.js"></script>
<script src="app.js?v=20261112-2"></script>
</body>
</html>
