<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://static.line-scdn.net https://liffsdk.line-scdn.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://idly-junction-altitude.ngrok-free.dev https://api.line.me https://*.line.me https://*.line-scdn.net https://uts-front.line-apps.com; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="robots" content="noindex, nofollow">
<title>行銷工具｜水晶呢喃</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap">
<style>
:root {
--bg: #F5F2F8; --card: #FFFFFF; --ink: #241B2F; --muted: #6E6578; --line: #E6DFEE;
--brand: #6A3D9E; --brand-soft: #EFE7F8; --on-brand: #FFFFFF;
--body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
--display: "Noto Serif TC", "Songti TC", serif;
}
:root[data-theme="dark"] {
--bg: #17131D; --card: #221C2B; --ink: #EEE8F4; --muted: #A79DB3; --line: #352C40;
--brand: #B795E6; --brand-soft: #2E2440; --on-brand: #1E1428; color-scheme: dark }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.6; }
.wrap { max-width: 520px; margin: 0 auto; padding: 20px 16px 48px; display: grid; gap: 14px; }
button { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
.hero { display: flex; gap: 12px; align-items: center; padding: 4px 2px; }
.hero > div:nth-child(2) { flex: 1; min-width: 0; }
.gem { flex: none; width: 48px; height: 48px; border-radius: 14px; background: linear-gradient(135deg, #8D63C4, #6A3D9E 55%, #4B2577); display: grid; place-items: center; color: #fff; font-family: var(--display); font-size: 1.4rem; }
.hero h1 { margin: 0; font-family: var(--display); font-size: 1.4rem; letter-spacing: .08em; }
.hero p { margin: 0; color: var(--muted); font-size: .86rem; }
.theme-btn { flex: none; width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--card); display: grid; place-items: center; }
.theme-btn svg { width: 19px; height: 19px; fill: none; stroke: var(--ink); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.list { display: grid; gap: 12px; }
.tool { display: flex; gap: 14px; align-items: center; width: 100%; text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 16px; text-decoration: none; color: inherit; }
a.tool:active { transform: scale(.99); }
.tool .ic { flex: none; width: 52px; height: 52px; border-radius: 14px; background: var(--brand-soft); display: grid; place-items: center; font-size: 1.6rem; }
.tool .tx { flex: 1; min-width: 0; display: grid; gap: 2px; }
.tool h2 { margin: 0; font-size: 1.05rem; }
.tool p { margin: 0; color: var(--muted); font-size: .86rem; }
.tool .go { flex: none; color: var(--brand); font-size: 1.3rem; }
.tool.soon { opacity: .6; }
.tool .tag { flex: none; font-size: .75rem; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; }
.msg { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 24px 16px; text-align: center; color: var(--muted); }
.msg h2 { margin: 0 0 6px; color: var(--ink); font-size: 1.05rem; }
</style>
</head>
<body>
<div class="wrap">
<header class="hero">
<div class="gem" aria-hidden="true">工</div>
<div>
<h1>行銷工具</h1>
<p>選一個工具開始</p>
</div>
<button type="button" class="theme-btn" id="theme" aria-label="切換深色模式"></button>
</header>
<div class="msg" id="msg">載入中…</div>
<div class="list" id="list" hidden></div>
</div>
<script src="https://static.line-scdn.net/liff/edge/versions/2.31.2/sdk.js"></script>
<script src="app.js?v=20261111-1"></script>
</body>
</html>
